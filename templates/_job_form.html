<section id="post" class="card p-3 mb-4">
  <h5><i class="bi bi-plus-circle"></i> {{ heading }}</h5>
  <form method="post" action="{{ url_for('post_job') }}" class="row g-2">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="col-md-6"><input name="title" class="form-control form-control-sm" placeholder="Role title" required></div>
    <div class="col-md-6"><input name="company" class="form-control form-control-sm" placeholder="Company" required></div>
    <div class="col-12"><textarea name="description" class="form-control form-control-sm" rows="2" placeholder="Details, location, stipend" required></textarea></div>
    <div class="col-md-6"><input name="min_cgpa" type="number" step="0.1" min="0" max="10" class="form-control form-control-sm" placeholder="Minimum CGPA"></div>
    <div class="col-md-6"><button class="btn btn-primary btn-sm w-100">Post</button></div>
  </form>
</section>
